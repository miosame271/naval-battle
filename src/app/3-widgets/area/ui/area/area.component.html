@if (!loading()) {
  <div class="area">
    @for (field of fields(); track $index) {
      <button class="field"
      (click)="processClick($index)"></button>
    }
  </div>
  <div class="ships-container">
    @for (ship of ships(); track $index) {
      <app-ship [ship]="ship" [ngStyle]="{ top: ship.startPosition.row * 30 - 30 + 'px', left: ship.startPosition.column * 30 - 30 + 'px' }"></app-ship>
    }
  </div>
} @else {
  <p>Загружается...</p>
}
